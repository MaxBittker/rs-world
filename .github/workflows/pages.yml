name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

env:
    # The server whose cache the site is built from and whose world feed it streams.
    # Override either with repository variables of the same name.
    RS_SDK_SERVER: ${{ vars.RS_SDK_SERVER || 'https://rs-sdk-demo.fly.dev' }}
    WORLD_FEED_URL: ${{ vars.WORLD_FEED_URL || 'wss://rs-sdk-demo.fly.dev/worldfeed' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: yarn

            - uses: oven-sh/setup-bun@v2

            - id: pages
              uses: actions/configure-pages@v5

            # sharp (texture export script only) doesn't build on new Node, and husky isn't needed.
            - run: yarn install --frozen-lockfile --ignore-scripts

            - run: bun scripts/sync-rs-sdk-cache.ts --server "$RS_SDK_SERVER"

            - run: yarn build
              env:
                  # CRA fails the build on lint warnings when CI is set; upstream has plenty.
                  CI: false
                  PUBLIC_URL: ${{ steps.pages.outputs.base_path }}
                  REACT_APP_WORLD_FEED_URL: ${{ env.WORLD_FEED_URL }}

            - run: cp -r caches build/caches

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: build

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
